name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Safety guard (rg checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run guard
        run: ./scripts/guard.sh

  logic-tests:
    name: Pure-Swift logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Run pure-Swift tests
        run: ./scripts/run-pure-swift-tests.sh

  build:
    name: Build + test (unsigned .app)
    needs: [guard, logic-tests]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          newest_xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest_xcode"
          sudo xcode-select -s "$newest_xcode"
          xcodebuild -version
      - name: Unit tests
        run: |
          xcodebuild test \
            -project leanring-buddy.xcodeproj \
            -scheme TomLens \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee test.log
      - name: Build Release (ad-hoc signed, no Apple team)
        run: |
          xcodebuild build \
            -project leanring-buddy.xcodeproj \
            -scheme TomLens \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Verify bundle
        run: |
          app="build/DerivedData/Build/Products/Release/TomLens.app"
          # Plain ad-hoc signing pins Screen Recording to the cdhash, so each
          # update looks revoked. An identifier designated requirement stays
          # the same across builds without a paid certificate or a stored key.
          codesign --force --deep --sign - --options runtime \
            --entitlements leanring-buddy/leanring-buddy.entitlements \
            -r '=designated => identifier "com.razacodespython.tomlens"' \
            "$app"
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "CODESIGN_DESIGNATED_REQUIREMENT_BEGIN"
          echo "$requirement"
          echo "CODESIGN_DESIGNATED_REQUIREMENT_END"
          python3 - "$requirement" <<'PY'
          import sys
          text = sys.argv[1]
          if 'identifier "com.razacodespython.tomlens"' not in text:
              sys.exit("designated requirement is not identifier-based")
          if "cdhash" in text:
              sys.exit("designated requirement still pins cdhash")
          PY
          codesign --verify --verbose "$app"
          codesign --display --entitlements - "$app"
          min_os=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$min_os"
          python3 -c "import sys; v=tuple(int(p) for p in sys.argv[1].split('.')); sys.exit(0 if v >= (14,2) else 1)" "$min_os"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$bundle_id" = "com.razacodespython.tomlens"
          ditto -c -k --keepParent "$app" TomLens-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TomLens-unsigned-app
          path: TomLens-unsigned.zip
          if-no-files-found: error
